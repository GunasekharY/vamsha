version: "3.9"

services:
  neo4j:
    image: neo4j:5.23-community
    container_name: vamsha-neo4j
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    environment:
      NEO4J_AUTH: neo4j/vamsha_dev_password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vamsha-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: vamsha-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: vamsha
      MINIO_ROOT_PASSWORD: vamsha_dev_secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-08-20T00-00-00Z
    container_name: vamsha-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vamsha vamsha_dev_secret &&
      mc mb --ignore-existing local/vamsha-photos &&
      mc anonymous set download local/vamsha-photos
      "

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: vamsha-api
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: vamsha_dev_password
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/vamsha-photos
      S3_BUCKET: vamsha-photos
      S3_ACCESS_KEY: vamsha
      S3_SECRET_KEY: vamsha_dev_secret
      S3_REGION: us-east-1
      PORT: 4000
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: vamsha-web
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000/graphql
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages

volumes:
  neo4j_data:
  minio_data:
